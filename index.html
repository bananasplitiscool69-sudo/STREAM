<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage Live</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#14121f;--panel:#1d1a2e;--line:#2e2a47;--text:#ebe9f7;--dim:#9a96b8;--accent:#5865f2;--live:#ed4245;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Sora,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--accent);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
button.alt{background:var(--line)}
[hidden]{display:none!important}
.top .sp{flex:1}
.top button{padding:6px 12px;font-size:13px}
.top input[type=range]{width:90px;padding:0}
button.end{background:var(--live)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.screen{display:none;height:100%}
.screen.on{display:block}
.center{display:grid;place-items:center;height:100%;padding:20px;overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(440px,100%)}
h1{font-size:34px;font-weight:800;margin:0 0 4px;letter-spacing:-1px}
h2{font-size:18px;margin:20px 0 8px}
p{color:var(--dim);margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.stage{display:grid;grid-template-columns:1fr 320px;height:100%}
.main{display:flex;flex-direction:column;padding:16px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top b{font-size:18px}
.badge{background:var(--live);border-radius:6px;padding:2px 10px;font-size:12px;font-weight:800}
.badge.off{background:var(--line);color:var(--dim)}
.vwrap{position:relative;flex:1;min-height:0;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}
.msg button{margin-top:10px;color:#fff}
.share{display:flex;gap:8px;margin-top:12px}
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.aud{padding:14px 16px;border-bottom:1px solid var(--line);max-height:30%;overflow:auto}
.aud span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin:0 6px 6px 0;font-size:13px}
.aud span.host{border-color:var(--accent)}
.chat{flex:1;overflow:auto;padding:12px 16px}
.chat div{margin-bottom:8px;word-break:break-word}
.chat b{color:#a5acff}.chat .sys{color:var(--dim);font-style:italic}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.err{color:#ff8a8c;min-height:20px;font-size:14px}
#hostPrev{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#3ba55d}
.astat{font-size:13px;color:var(--dim);margin-top:6px;min-height:20px}
.astat.bad{color:#ff8a8c}
@media(max-width:800px){.stage{grid-template-columns:1fr;grid-template-rows:55% 45%}.side{border-left:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home" class="screen on"><div class="center"><div class="box">
  <h1>Stage Live</h1>
  <p>Stream from OBS. Everyone watches in the browser.</p>
  <label for="code">Watch a stream</label>
  <div class="row"><input id="code" placeholder="Room code" autocomplete="off"><button id="watchBtn">Watch</button></div>
  <h2>Stream yourself</h2>
  <button id="hostBtn" class="alt" style="width:100%">Set up my stream</button>
</div></div></div>

<div id="setup" class="screen"><div class="center"><div class="box">
  <h1>Pick your source</h1>
  <p>The OBS Virtual Camera has no sound. Pick a mic or virtual audio cable below, or share a tab/screen with audio.</p>
  <label for="vsel">Video</label><select id="vsel"></select>
  <label for="asel">Audio</label><select id="asel"></select>
  <label for="qsel">Quality</label>
  <select id="qsel"><option value="720p30">720p 30fps (light on upload)</option><option value="1080p30" selected>1080p 30fps (recommended)</option><option value="1080p60">1080p 60fps (needs fast upload)</option><option value="1440p30">1440p 30fps (needs very fast upload)</option></select>
  <video id="hostPrev" muted autoplay playsinline></video>
  <div class="meter" aria-hidden="true"><i id="meterBar"></i></div>
  <div class="astat" id="astat"></div>
  <button id="retryBtn" class="alt" style="width:100%;margin-top:10px">Allow microphone / refresh devices</button>
  <div class="row" style="margin-top:10px"><button id="screenBtn" class="alt">Share screen / tab instead</button><button id="liveBtn">Go live</button></div>
  <div class="err" id="setupErr"></div>
</div></div></div>

<div id="room" class="screen"><div class="stage">
  <div class="main">
    <div class="top"><b id="title">Stage</b><span class="badge off" id="badge">Connecting</span><span class="sp"></span><input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" hidden><button id="fsBtn" class="alt">Fullscreen</button><button id="endBtn" class="alt">Leave</button><button id="muteBtn" class="alt" hidden>Mute</button></div>
    <div class="vwrap"><video id="vid" autoplay playsinline muted></video><div class="msg" id="vmsg"></div></div>
    <div class="share" id="shareRow" hidden><input id="link" readonly aria-label="Watch link"><button id="copyBtn">Copy link</button></div>
  </div>
  <div class="side">
    <div class="aud" id="aud"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="send"><input id="chatIn" placeholder="Send a message" maxlength="300" autocomplete="off"><button id="sendBtn">Send</button></div>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const PREFIX='stagelive-',MAX_VIEWERS=8;
let peer,stream,isHost=false,myName='Viewer',viewers=new Map();
let meterCtx=null,meterRaf=0,mixCtx=null;

const QUALITY={'720p30':{w:1280,h:720,f:30,b:4000000},'1080p30':{w:1920,h:1080,f:30,b:8000000},'1080p60':{w:1920,h:1080,f:60,b:12000000},'1440p30':{w:2560,h:1440,f:30,b:14000000}};
const Q=()=>QUALITY[$('qsel').value]||QUALITY['1080p30'];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function addMsg(name,text,sys){const d=document.createElement('div');if(sys){d.className='sys';d.textContent=text}else{const b=document.createElement('b');b.textContent=name+': ';d.append(b,document.createTextNode(text))}const c=$('chat');c.append(d);c.scrollTop=c.scrollHeight}
function setBadge(t,live){$('badge').textContent=t;$('badge').classList.toggle('off',!live)}
function renderAud(list){const a=$('aud');a.textContent='';list.forEach(u=>{const s=document.createElement('span');s.textContent=u.name;if(u.host)s.className='host';a.append(s)})}

/* ---------- Audio level meter (host setup) ---------- */
function stopMeter(){
  cancelAnimationFrame(meterRaf);
  if(meterCtx){meterCtx.close().catch(()=>{});meterCtx=null}
  $('meterBar').style.width='0';
}
function startMeter(s){
  stopMeter();
  const at=s.getAudioTracks();
  const st=$('astat');
  if(!at.length){st.className='astat bad';st.textContent='No audio track. Viewers will hear nothing.';return}
  st.className='astat';st.textContent='Audio: '+(at[0].label||'active')+' (the bar should move when there is sound)';
  try{
    meterCtx=new (window.AudioContext||window.webkitAudioContext)();
    meterCtx.resume().catch(()=>{});
    const an=meterCtx.createAnalyser();an.fftSize=512;
    meterCtx.createMediaStreamSource(new MediaStream(at)).connect(an);
    const buf=new Uint8Array(an.fftSize);
    (function tick(){
      an.getByteTimeDomainData(buf);
      let m=0;for(let i=0;i<buf.length;i++)m=Math.max(m,Math.abs(buf[i]-128));
      $('meterBar').style.width=Math.min(100,m/128*160)+'%';
      meterRaf=requestAnimationFrame(tick);
    })();
  }catch(e){}
}

/* ---------- Host ---------- */
function permMsg(errs){
  if(!errs.length)return '';
  const hints={NotAllowedError:'blocked. Click the lock icon in the address bar, set it to Allow, then press the button below',NotFoundError:'no device found',NotReadableError:'in use by another app',SecurityError:'blocked by the page security settings'};
  return errs.map(e=>e.what+' '+(hints[e.name]||e.name)).join('. ')+'.';
}
async function listDevices(){
  const errs=[];
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    errs.push({what:'Microphone',name:'SecurityError'});
    $('setupErr').textContent='This page cannot use the mic. It must be opened over https:// in its own tab (not a preview pane).';
    return errs;
  }
  /* Ask separately so a missing camera can never stop the mic prompt. */
  for(const [what,c] of [['Microphone',{audio:true}],['Camera',{video:true}]]){
    try{const t=await navigator.mediaDevices.getUserMedia(c);t.getTracks().forEach(x=>x.stop())}
    catch(e){errs.push({what,name:e.name})}
  }
  const d=await navigator.mediaDevices.enumerateDevices();
  const fill=(el,kind,none)=>{el.textContent='';d.filter(x=>x.kind===kind).forEach(x=>{const o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||kind;el.append(o)});if(none){const o=document.createElement('option');o.value='';o.textContent=none;el.append(o)}};
  fill($('vsel'),'videoinput');
  fill($('asel'),'audioinput','No audio');
  const obs=[...$('vsel').options].find(o=>/obs/i.test(o.textContent));if(obs)$('vsel').value=obs.value;
  /* Prefer a virtual cable / OBS audio device, otherwise the first real input. */
  const aopts=[...$('asel').options].filter(o=>o.value);
  const cable=aopts.find(o=>/cable|blackhole|voicemeeter|obs|stereo mix|loopback|virtual/i.test(o.textContent));
  const pick=cable||aopts.find(o=>o.value!=='default'&&o.value!=='communications')||aopts[0];
  if(pick)$('asel').value=pick.value;
  return errs;
}
async function preview(){
  $('setupErr').textContent='';
  try{
    stopMeter();
    stream&&stream.getTracks().forEach(t=>t.stop());
    const v=$('vsel').value,a=$('asel').value;
    stream=await navigator.mediaDevices.getUserMedia({
      video:v?{deviceId:{exact:v},width:{ideal:Q().w},height:{ideal:Q().h},frameRate:{ideal:Q().f}}:true,
      audio:a?{deviceId:{exact:a},echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:2}:false
    });
    $('hostPrev').srcObject=stream;
    startMeter(stream);
  }catch(e){
    $('setupErr').textContent='Could not open that source: '+e.message;
    /* If audio was the problem, still try video alone so the page keeps working. */
    try{
      const v=$('vsel').value;
      stream=await navigator.mediaDevices.getUserMedia({video:v?{deviceId:{exact:v}}:true,audio:false});
      $('hostPrev').srcObject=stream;startMeter(stream);
    }catch(e2){}
  }
}
async function shareScreen(){
  $('setupErr').textContent='';
  try{
    stopMeter();
    const disp=await navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:Q().w},height:{ideal:Q().h},frameRate:{ideal:Q().f}},audio:true});
    let mic=null;
    const a=$('asel').value;
    if(a){try{mic=await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:a},echoCancellation:true,noiseSuppression:true}})}catch(e){}}
    stream&&stream.getTracks().forEach(t=>t.stop());
    const srcs=[disp,mic].filter(s=>s&&s.getAudioTracks().length);
    let audio=null;
    if(srcs.length>1){
      mixCtx&&mixCtx.close().catch(()=>{});
      mixCtx=new (window.AudioContext||window.webkitAudioContext)();
      const dest=mixCtx.createMediaStreamDestination();
      srcs.forEach(s=>mixCtx.createMediaStreamSource(new MediaStream(s.getAudioTracks())).connect(dest));
      audio=dest.stream.getAudioTracks()[0];
    }else if(srcs.length){audio=srcs[0].getAudioTracks()[0]}
    stream=new MediaStream([...disp.getVideoTracks(),...(audio?[audio]:[])]);
    $('hostPrev').srcObject=stream;
    startMeter(stream);
    if(!disp.getAudioTracks().length&&!mic)$('setupErr').textContent='No tab/system audio was shared. Tick "Share audio" in the browser prompt, or pick a mic.';
  }catch(e){$('setupErr').textContent='Screen share cancelled.'}
}
function capBitrate(call){
  setTimeout(()=>{try{call.peerConnection.getSenders().forEach(s=>{
    if(!s.track)return;
    const p=s.getParameters();p.encodings=p.encodings&&p.encodings.length?p.encodings:[{}];
    if(s.track.kind==='video'){p.encodings[0].maxBitrate=Q().b;p.degradationPreference='maintain-resolution'}
    else p.encodings[0].maxBitrate=128000;
    s.setParameters(p).catch(()=>{});
  })}catch(e){}},1500);
}
/* Ask Chrome to start near the target bitrate instead of ramping up slowly. */
function boostSdp(sdp){
  const k=Math.round(Q().b/1000);
  return sdp.replace(/a=fmtp:\d+ [^\r\n]*/g,m=>/apt=|useinbandfec/.test(m)?m:m+';x-google-min-bitrate='+Math.round(k/2)+';x-google-start-bitrate='+Math.round(k*0.8)+';x-google-max-bitrate='+k);
}
/* VP9 looks better per bit; for 60fps use H264 (usually hardware encoded). */
function preferCodec(call){
  try{
    const caps=RTCRtpSender.getCapabilities('video');if(!caps)return;
    const first=Q().f>30?'video/H264':'video/VP9';
    const sorted=[...caps.codecs].sort((a,b)=>(b.mimeType===first)-(a.mimeType===first));
    call.peerConnection.getTransceivers().forEach(t=>{if(t.sender&&t.sender.track&&t.sender.track.kind==='video')t.setCodecPreferences(sorted)});
  }catch(e){}
}
function broadcast(m){viewers.forEach(v=>v.conn.open&&v.conn.send(m))}
function pushAudience(){const list=[{name:'Host',host:true},...[...viewers.values()].filter(v=>v.name).map(v=>({name:v.name}))];renderAud(list);broadcast({t:'users',list})}
function goLive(code,tries){
  peer=new Peer(PREFIX+code);
  peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<4){peer.destroy();goLive(Math.random().toString(36).slice(2,8),tries+1)}else addMsg('','Connection problem: '+e.type,true)});
  peer.on('open',()=>{
    const url=location.origin+location.pathname+'?room='+code;
    $('title').textContent='Room '+code;$('link').value=url;$('shareRow').hidden=false;
    setBadge('Live',true);$('vmsg').hidden=true;$('endBtn').textContent='End stream';$('endBtn').className='end';
    $('vid').srcObject=stream;$('vid').muted=true;
    renderAud([{name:'Host',host:true}]);
    addMsg('','You are live. Share the link above.',true);
    addMsg('',stream.getAudioTracks().length?'Audio is being sent. Your own preview is muted to avoid echo.':'Warning: no audio track, viewers will hear nothing.',true);
  });
  peer.on('connection',c=>{
    c.on('open',()=>{
      if(viewers.size>=MAX_VIEWERS){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
      viewers.set(c.peer,{conn:c,name:''});
    });
    c.on('data',d=>{
      const v=viewers.get(c.peer);if(!v)return;
      if(d.t==='join'){
        v.name=String(d.name||'Viewer').slice(0,20);
        const call=peer.call(c.peer,stream,{sdpTransform:boostSdp});preferCodec(call);capBitrate(call);
        broadcast({t:'chat',sys:true,text:v.name+' joined'});addMsg('',v.name+' joined',true);pushAudience();
      }else if(d.t==='chat'){
        const text=String(d.text||'').slice(0,300);if(!text)return;
        addMsg(v.name,text);broadcast({t:'chat',name:v.name,text});
      }
    });
    c.on('close',()=>{const v=viewers.get(c.peer);viewers.delete(c.peer);if(v&&v.name){broadcast({t:'chat',sys:true,text:v.name+' left'});addMsg('',v.name+' left',true)}pushAudience()});
  });
}

/* ---------- Viewer ---------- */
function onData(d){
  if(d.t==='chat')addMsg(d.name,d.text,d.sys);
  else if(d.t==='users')renderAud(d.list);
  else if(d.t==='end'){$('vmsg').hidden=false;$('vmsg').textContent='The host ended the stream.';setBadge('Ended',false)}
  else if(d.t==='full'){$('vmsg').textContent='This stage is full right now (max '+MAX_VIEWERS+' viewers).';setBadge('Full',false)}
}
function showUnmute(){
  const m=$('vmsg');m.hidden=false;m.textContent='';
  const b=document.createElement('button');b.textContent='Click to hear the stream';
  b.onclick=()=>setMute(false);m.append(b);
}
function watch(code,name){
  show('room');$('title').textContent='Room '+code;
  $('vmsg').textContent='Joining…';setBadge('Connecting',false);
  peer=new Peer();
  peer.on('error',e=>{$('vmsg').textContent=e.type==='peer-unavailable'?'This stream is not live. Check the room code.':'Connection problem: '+e.type;setBadge('Offline',false)});
  peer.on('call',call=>{
    call.answer();
    call.on('stream',s=>{
      const v=$('vid');
      if(v.srcObject===s)return;           /* the event can fire once per track */
      v.srcObject=s;
      v.volume=+$('vol').value||1;
      v.muted=false;
      setBadge('Live',true);$('muteBtn').hidden=false;$('vol').hidden=false;
      const hasAudio=s.getAudioTracks().length>0;
      if(!hasAudio)addMsg('','The host is not sending audio.',true);
      v.play().then(()=>{
        $('vmsg').hidden=true;$('muteBtn').textContent='Mute';
      }).catch(()=>{
        /* Browser blocked autoplay with sound: start muted, ask for one click. */
        v.muted=true;v.play().catch(()=>{});
        $('muteBtn').textContent='Unmute';
        if(hasAudio)showUnmute();else $('vmsg').hidden=true;
      });
    });
  });
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});
    c.on('open',()=>{c.send({t:'join',name});window._conn=c});
    c.on('data',onData);
    c.on('close',()=>{$('vmsg').hidden=false;$('vmsg').textContent='The stream has ended.';setBadge('Ended',false)});
  });
}
function sendChat(){
  const t=$('chatIn').value.trim();if(!t)return;$('chatIn').value='';
  if(isHost){addMsg('Host',t);broadcast({t:'chat',name:'Host',text:t})}
  else if(window._conn&&window._conn.open){window._conn.send({t:'chat',text:t})}
}

/* ---------- Wiring ---------- */
async function setupHost(){
  show('setup');
  const errs=await listDevices();
  await preview();
  const m=permMsg(errs);
  if(m)$('setupErr').textContent=m+(errs.length&&$('setupErr').textContent?' '+$('setupErr').textContent:'');
}
$('hostBtn').onclick=()=>{isHost=true;setupHost()};
$('retryBtn').onclick=setupHost;
$('vsel').onchange=$('asel').onchange=$('qsel').onchange=preview;
$('screenBtn').onclick=shareScreen;
$('liveBtn').onclick=()=>{
  if(!stream){$('setupErr').textContent='Pick a source first.';return}
  if(!stream.getAudioTracks().length&&!confirm('There is no audio in this stream, so viewers will hear nothing. Go live anyway?'))return;
  stopMeter();
  stream.getVideoTracks().forEach(t=>{try{t.contentHint='motion'}catch(e){}});
  show('room');goLive(Math.random().toString(36).slice(2,8),0);
};
$('watchBtn').onclick=()=>{const c=$('code').value.trim().toLowerCase();if(!c)return;const n=prompt('Your name for chat?','Viewer')||'Viewer';myName=n.slice(0,20);watch(c,myName)};
$('code').onkeydown=e=>{if(e.key==='Enter')$('watchBtn').click()};
function setMute(m){
  const v=$('vid');v.muted=m;
  if(!m){v.volume=+$('vol').value||1;v.play().catch(()=>{});$('vmsg').hidden=true}
  $('muteBtn').textContent=m?'Unmute':'Mute';
}
$('muteBtn').onclick=()=>setMute(!$('vid').muted);
$('vol').oninput=()=>{$('vid').volume=+$('vol').value};
function endStream(){
  if(isHost){
    if(!confirm('End the stream for everyone?'))return;
    broadcast({t:'end'});
    stream&&stream.getTracks().forEach(t=>t.stop());
  }
  setTimeout(()=>{try{peer&&peer.destroy()}catch(e){}location.href=location.pathname},isHost?300:0);
}
$('fsBtn').onclick=()=>{const w=document.querySelector('.vwrap');(document.fullscreenElement?document.exitFullscreen():w.requestFullscreen()).catch(()=>{})};
$('endBtn').onclick=endStream;
$('sendBtn').onclick=sendChat;
$('chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat()};
$('copyBtn').onclick=()=>{navigator.clipboard.writeText($('link').value).then(()=>{$('copyBtn').textContent='Copied'})};
const room=new URLSearchParams(location.search).get('room');
if(room){$('code').value=room;$('watchBtn').focus()}
</script>
</body>
</html>
